name: Release Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pnMarket
        uses: actions/checkout@v4

      - name: Verify GUI hotfix architecture
        run: |
          ! grep -q "InventoryOpenEvent" src/main/java/ru/privatenull/gui/MarketInventoryListener.java
          ! grep -q "runTask(plugin, () -> applyConfiguredDecorations" src/main/java/ru/privatenull/gui/MarketInventoryListener.java
          grep -q "return GuiAnimationProfile.standard();" src/main/java/ru/privatenull/PnMarketPlugin.java
          grep -q "applyConfiguredDecorations(inv);" src/main/java/ru/privatenull/gui/MarketGuiController.java
          grep -q "applyConfiguredDecorations(inventory);" src/main/java/ru/privatenull/gui/MarketGuiController.java
          grep -q "applyConfiguredDecorations(view.inventory);" src/main/java/ru/privatenull/gui/MarketGuiController.java
          grep -q 'gui.applyDecorations(inventory, "delivery");' src/main/java/ru/privatenull/delivery/DeliveryService.java

      - name: Checkout pnLibrary
        run: git clone --depth=1 https://github.com/pnFolder/pnLibrary.git ../pnLibrary

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Prepare release artifact
        run: cp build/libs/pnMarket-1.2.0.jar pnMarket-1.2.0-paper-mc1.16.5-java17.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnMarket-1.2.0-paper-mc1.16.5-java17
          path: pnMarket-1.2.0-paper-mc1.16.5-java17.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; skipping publication."
            exit 0
          fi
          gh release create v1.2.0 \
            pnMarket-1.2.0-paper-mc1.16.5-java17.jar \
            --repo pnFolder/pnMarket \
            --target "$GITHUB_SHA" \
            --title "v1.2.0 — Добавлены декорации доставки" \
            --notes-file RELEASE-1.2.0.md
