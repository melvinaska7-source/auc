name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pnMarket
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      # settings.gradle подключает ../pnLibrary через includeBuild.
      # Коммит из README (6053231) слишком старый: в нём нет PluginBanner/PluginUpdateService,
      # которые нужны GitHubUpdater. Свежий main требует Gradle 9. Поэтому перебираем
      # теги pnLibrary от старых к новым и берём первый, с которым pnMarket компилируется.
      - name: Find compatible pnLibrary
        run: |
          git clone https://github.com/pnFolder/pnLibrary.git ../pnLibrary
          cd ../pnLibrary
          REFS=$(git tag --sort=creatordate)
          cd - > /dev/null
          FOUND=""
          for ref in $REFS; do
            echo "::group::Try pnLibrary $ref"
            git -C ../pnLibrary checkout -q "$ref"
            if ./gradlew compileJava --no-daemon -q; then
              FOUND="$ref"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          if [ -z "$FOUND" ]; then
            echo "Не нашлось совместимого тега pnLibrary"
            exit 1
          fi
          echo "Используем pnLibrary $FOUND"

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pnMarket
          path: build/libs/pnMarket-1.2.0.jar
          if-no-files-found: error
