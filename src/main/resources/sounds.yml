# Укажите type: NONE, чтобы отключить отдельный звук.
# volume и pitch принимают значения от 0 до 2.

gui:
  open: { type: BLOCK_CHEST_OPEN, volume: 0.2, pitch: 1.1 }
  open-low: { type: BLOCK_CHEST_OPEN, volume: 0.2, pitch: 1.0 }
  close: { type: BLOCK_CHEST_CLOSE, volume: 0.2, pitch: 1.1 }
  click: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.0 }
  click-low: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 0.9 }
  click-high: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.2 }
  page-previous: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 0.95 }
  page-next: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.05 }
  quantity-minus-one: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.0 }
  quantity-minus-ten: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 0.9 }
  quantity-plus-one: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.1 }
  quantity-plus-ten: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.15 }

action:
  search: { type: BLOCK_NOTE_BLOCK_PLING, volume: 0.2, pitch: 1.4 }
  listing-created: { type: ENTITY_PLAYER_LEVELUP, volume: 0.2, pitch: 1.3 }
  purchase: { type: ENTITY_PLAYER_LEVELUP, volume: 0.2, pitch: 1.25 }
  seller-sale: { type: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.2, pitch: 1.4 }
  listing-returned: { type: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.2, pitch: 1.3 }
  item-collected: { type: BLOCK_CHEST_CLOSE, volume: 0.2, pitch: 1.1 }
  favorite-found: { type: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.8, pitch: 1.0 }
  favorite-added: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.2 }
  favorite-removed: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 0.8 }
  favorite-deleted: { type: ENTITY_ITEM_BREAK, volume: 0.2, pitch: 1.1 }

error:
  default: { type: ENTITY_VILLAGER_NO, volume: 0.2, pitch: 0.8 }
  no-money: { type: ENTITY_VILLAGER_NO, volume: 0.2, pitch: 0.7 }

machine:
  open: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.2 }
  select: { type: UI_BUTTON_CLICK, volume: 0.2, pitch: 1.35 }
  error: { type: ENTITY_VILLAGER_NO, volume: 0.2, pitch: 1.0 }
